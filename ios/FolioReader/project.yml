name: FolioReader
options:
  bundleIdPrefix: io.folio
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: "0.9.19"
targets:
  FolioReader:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Folio
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBonjourServices:
          - _folio._tcp
        NSLocalNetworkUsageDescription: Folio discovers your self-hosted EPUB library on your local network and Tailnet.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: io.folio.reader
            CFBundleURLSchemes:
              - folio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.folio.reader
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: ZIPFoundation
